services:
  homelab-griller:
    image: ghcr.io/borderlane-ha/homelab-griller:latest
    container_name: homelab-griller
    restart: unless-stopped
    ports:
      - "8091:80"
      # Uncomment to expose HTTPS (self-signed by default):
      # - "8443:443"
    environment:
      TZ: Europe/Berlin
      GRILLER_DEFAULT_LANGUAGE: de
    volumes:
      - ./data:/var/www/html/data
