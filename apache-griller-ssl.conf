<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html
    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile /var/www/html/data/tls/server.crt
    SSLCertificateKeyFile /var/www/html/data/tls/server.key
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/html/data>
        Require all denied
    </Directory>
</VirtualHost>
</IfModule>
